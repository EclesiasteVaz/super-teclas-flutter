  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0C1017;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #0C1017;
      z-index: 99999;
      transition: opacity 0.35s ease-out;
    }
    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 24px;
      border-radius: 16px;
      background-color: #141B26;
      border: 1px solid #222F42;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      min-width: 260px;
    }
    .splash-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0 0 20px 0;
    }
    .splash-super {
      color: #1884FF;
    }
    .splash-teclas {
      color: #F8FAFC;
    }
    .splash-loader {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(24, 132, 255, 0.2);
      border-top-color: #1884FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .splash-caption {
      margin-top: 16px;
      font-size: 13px;
      color: #94A3B8;
      letter-spacing: 0.2px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash-screen">
    <div class="splash-card">
      <div class="splash-title">
        <span class="splash-super">Super</span> <span class="splash-teclas">Teclas</span>
      </div>
      <div class="splash-loader"></div>
      <div class="splash-caption">Carregando...</div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
