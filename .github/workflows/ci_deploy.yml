name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure .env placeholder exists
        run: touch .env

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting and lints
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test
